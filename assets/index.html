<!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Trainer</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <header>
    <h1>Studio Trainer</h1>
    <span class="version" id="version">v—</span>
    <span class="about">Anima 2B LoRA / fine-tune · fork of Anima TrainFlow by ThetaCursed</span>
  </header>

  <main>
    <!-- ===== Top: project + training params ===== -->
    <div class="row">
      <div class="panel">
        <div class="label">Project</div>
        <div class="fields">
          <label class="field"><span>Trigger Word / Project Name</span>
            <input type="text" data-key="trigger_word" placeholder="e.g. unique_style" /></label>
          <label class="field"><span>Dataset Path (images + .txt)</span>
            <input type="text" data-key="dataset_path" placeholder="C:/Images/MyDataset" /></label>
        </div>

        <details class="acc">
          <summary>Model paths — set once</summary>
          <div class="acc-body">
            <label class="field"><span>DiT</span><input type="text" data-key="dit_path" /></label>
            <label class="field"><span>Qwen3</span><input type="text" data-key="qwen_path" /></label>
            <label class="field"><span>VAE</span><input type="text" data-key="vae_path" /></label>
          </div>
        </details>

        <div class="btn-row">
          <button class="btn primary" id="start-btn" data-icon="play">Start Training</button>
          <button class="btn danger" id="stop-btn" data-icon="stop">Stop</button>
          <button class="btn" id="folder-btn" data-icon="folder">Checkpoint Folder</button>
        </div>
      </div>

      <div class="panel">
        <div class="label">Training</div>
        <div class="fields">
          <label class="field"><span>Network Rank</span>
            <input type="number" data-key="network_rank" data-type="number" /></label>
          <label class="field"><span>Learning Rate</span>
            <input type="text" data-key="learning_rate" id="lr" /></label>
          <label class="field"><span>Optimizer</span>
            <select data-key="optimizer" id="optimizer">
              <option>Prodigy</option><option>AdamW8bit</option><option>AdamW</option>
            </select></label>
          <label class="field"><span>Batch Size</span>
            <input type="number" data-key="train_batch_size" data-type="number" /></label>
        </div>
        <div class="fields">
          <label class="field"><span>Training Steps</span>
            <input type="number" data-key="training_steps" data-type="number" /></label>
          <label class="field"><span>Save Every n</span>
            <input type="number" data-key="save_steps" data-type="number" /></label>
          <label class="field"><span>Preview Every n</span>
            <input type="number" data-key="sample_steps" data-type="number" /></label>
          <label class="field"><span>Grad Accumulation</span>
            <input type="number" data-key="gradient_accumulation_steps" data-type="number" /></label>
        </div>
        <div class="fields">
          <label class="field"><span>Blocks to Swap (0 = off)</span>
            <div class="range-row">
              <input type="range" min="0" max="26" step="1" data-key="blocks_to_swap" data-type="number" id="swap" />
              <output id="swap-out">0</output>
            </div></label>
          <label class="check"><input type="checkbox" data-key="full_finetune" id="full-ft" /> Full Fine-tune (no LoRA)</label>
        </div>
        <div class="fields">
          <label class="field"><span>LoRA Type</span>
            <select id="lora-type">
              <option>Custom</option><option>Style</option><option>Character</option>
              <option>Concept (switchable)</option><option>Concept (dominant)</option>
            </select></label>
          <label class="field"><span>VRAM Preset</span>
            <select id="vram-preset">
              <option>Custom</option><option>6 GB</option><option>12 GB</option><option>16 GB</option><option>24 GB</option>
            </select></label>
        </div>
        <div class="info" id="preset-info"></div>
      </div>
    </div>

    <!-- ===== Bottom: console + tools | preview + sample params ===== -->
    <div class="row">
      <div class="panel">
        <div class="label">Logs</div>
        <div class="console" id="console"></div>

        <div class="group">
          <div class="label">Smart Aspect Ratio Bucketing</div>
          <div class="fields">
            <label class="field"><span>Min Side (base)</span><input type="number" data-key="side_min" data-type="number" /></label>
            <label class="field"><span>Max Side (limit)</span><input type="number" data-key="side_max" data-type="number" /></label>
          </div>
          <div class="btn-row">
            <button class="btn" id="bucket-btn" data-icon="crop">Start Bucketing</button>
            <button class="btn" id="open-ds-btn" data-icon="folder">Open Dataset</button>
          </div>
        </div>

        <div class="group">
          <div class="label">Auto-Caption Dataset</div>
          <div class="fields">
            <label class="field"><span>General threshold</span><input type="number" step="0.01" min="0" max="1" data-key="tagger_gen_thresh" data-type="number" /></label>
            <label class="field"><span>Character threshold</span><input type="number" step="0.01" min="0" max="1" data-key="tagger_char_thresh" data-type="number" /></label>
          </div>
          <div class="btn-row">
            <button class="btn" id="tag-btn" data-icon="tag">Create .txt captions</button>
            <label class="check"><input type="checkbox" data-key="tagger_overwrite" /> Overwrite existing .txt</label>
          </div>
        </div>

        <div class="group">
          <div class="label">Prune Tags</div>
          <label class="field"><span>Tags to remove (comma-separated)</span>
            <input type="text" data-key="prune_tags" placeholder="e.g. white hair, yellow eyes, undercut" /></label>
          <div class="btn-row">
            <button class="btn" id="prune-btn" data-icon="scissors">Strip Tags from Captions</button>
          </div>
        </div>

        <div class="group">
          <div class="label">Updates</div>
          <div class="btn-row">
            <button class="btn" id="update-check-btn" data-icon="refresh">Check for Updates</button>
            <button class="btn" id="update-apply-btn" data-icon="refresh" style="display:none">Download &amp; Stage</button>
          </div>
          <div class="meta" id="update-status"></div>
        </div>
      </div>

      <div class="panel">
        <div class="label">Previews</div>
        <div class="gallery" id="gallery"><div class="empty">No previews yet</div></div>
        <div class="group">
          <label class="field"><span>Prompt (trigger word added automatically)</span>
            <textarea data-key="pos_prompt" rows="2"></textarea></label>
          <label class="field"><span>Negative Prompt</span>
            <textarea data-key="neg_prompt" rows="1"></textarea></label>
          <div class="fields">
            <label class="field"><span>Width</span><input type="number" data-key="width" data-type="number" /></label>
            <label class="field"><span>Height</span><input type="number" data-key="height" data-type="number" /></label>
            <label class="field"><span>Steps</span><input type="number" data-key="sample_steps_gen" data-type="number" /></label>
            <label class="field"><span>CFG</span><input type="number" step="0.1" data-key="sample_cfg" data-type="number" /></label>
            <label class="field"><span>Seed</span><input type="number" data-key="sample_seed" data-type="number" /></label>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
